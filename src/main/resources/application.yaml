spring:
  application:
    name: circle_platform_api
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/circle_platform?serverTimezone=Asia/Tokyo
    username: root
    password: root
  web:
    resources:
      add-mappings: false   # 处理404静态资源，搭配全局异常处理


mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true #声明mybatis查询SQL字段自动映射实体类的成员变量
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  mapper-locations: classpath*:mapper/*.xml,classpath*:mapper/**/*Mapper.xml
  global-config:
    db-config:
      id-type: auto #显式指定主键策略
      logic-delete-field: deleteAt #逻辑删除配置
      logic-delete-value: now()
      logic-not-delete-value: 'null'
      insert-strategy: not_null #全局配置插入或更新时不被null字段覆盖
      update-strategy: not_null
  type-aliases-package: com.example.circle_platform_api.entity #取别名映射





